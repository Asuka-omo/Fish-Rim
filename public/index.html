<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>FAT FISH · Desktop Interactive</title><style>*{box-sizing:border-box}html{background:#020609;color:#bad5df;font:16px ui-monospace,monospace}body{margin:0}button{font:inherit;background:#132d3a;color:#d7edf5;border:1px solid #5795ad;padding:13px 22px;cursor:pointer;min-height:46px}button:focus-visible{outline:2px solid #92ebff;outline-offset:3px}button:active{transform:translateY(2px)}button:disabled{opacity:.5}#boot{position:fixed;inset:0;z-index:5;display:grid;place-content:center;background:#020609;padding:30px}#boot>div{max-width:580px;padding:32px;border:1px solid #315c6c;box-shadow:12px 18px 35px #0009}h1{font-size:34px;font-weight:400}#boot p{line-height:1.6;color:#aac8d7}#loadStatus{min-height:24px;font-size:14px}.hit,.hit:disabled{opacity:0!important;padding:0!important;min-height:0!important;transform:none!important}#host{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#020609}[hidden]{display:none!important}</style><link rel="stylesheet" href="./layout.css"></head><body>

<!-- THESIS: A live hangar control wall surrounds the user's unaltered movie; H docks the neck at frame915; L releases the sealed bay.
OWN-WORLD: User-pinned DSH.png: deep black, cyan angular hairlines, compact monospace, restrained red signals and NASA night-light globe.
STORY: H docks the head, L authorizes the bay; monitor clocks/instruments/logs, hear independent mechanics and retained female broadcast, close full-screen shutters.
FIRST VIEWPORT: Video left at original aspect; globe/base upper-right, status/loads/telemetry middle-right, log and two terminal commands lower-right.
FORM: Code-led reproduction of supplied layout with explicit video-height adjustment. No concept seed or alternate visual world.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
<main hidden id="experience" aria-label="Fat Fish hangar control"><canvas id="stage" aria-label="Live hangar cinema and control panels"></canvas>
<button class="hit" id="head" disabled>HEAD DOCK · H</button><button class="hit" id="launch" disabled>BAY LAUNCH · L</button><button class="hit" id="play" aria-label="Pause or resume video">Pause</button><button class="hit" id="mute" aria-label="Mute all sound">Mute</button><button class="hit" id="settings" aria-label="Audio mixer settings">Audio mixer</button><button class="hit" id="fullscreen" aria-label="Toggle fullscreen">Fullscreen</button><button class="hit" id="replay" aria-label="Restart independent preview">Replay</button>
<section id="mixer" hidden aria-label="Audio mixer"><strong>AUDIO MIXER</strong><label>Music<input type="range" min="0" max="1" step=".01" value=".57" data-bus="MUSIC"></label><label>Mechanics<input type="range" min="0" max="1" step=".01" value=".93" data-bus="MECHANICAL"></label><label>Ambience<input type="range" min="0" max="1" step=".01" value=".56" data-bus="AMBIENCE"></label><label>Voice<input type="range" min="0" max="1" step=".01" value=".95" data-bus="VOICE"></label><button id="closeMixer">CLOSE</button></section>
<output class="sr" id="status" aria-live="polite">Preparing hangar</output><ol class="sr" id="log" aria-label="Hangar system log"></ol><output class="sr" id="command" aria-live="polite"></output><div id="media" aria-hidden="true"></div></main>
<section id="host" hidden><h1>Workspace ready.</h1><p id="hostMessage"></p><button id="webReplay">REPLAY</button></section>

<script type="module" src="./boot.js"></script></body></html>
